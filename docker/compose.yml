services:
  db:
    image: postgres:16-alpine
    container_name: pfk-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pfk_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-pfk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfk_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pfk_workspace_db:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pfk-workspace

networks:
  pfk-workspace:
    driver: bridge

volumes:
  pfk_workspace_db:
