spring:
  main:
    allow-bean-definition-overriding: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.pfk.workspace: INFO

pfk:
  security:
    jwt:
      issuer: pfk-workspace-test
      secret: test-secret-only
      access-token-ttl: 15m
      refresh-token-ttl: 30d
