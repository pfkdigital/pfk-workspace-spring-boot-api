spring:
  application:
    name: pfk-workspace

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pfk_workspace}
    username: ${POSTGRES_USER:pfk}
    password: ${POSTGRES_PASSWORD:pfk_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}

  docker:
    compose:
      enabled: true
      file: docker/compose.yml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

pfk:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Request-Id,X-Workspace-Id
    exposed-headers: X-Request-Id
    allow-credentials: true

  security:
    jwt:
      issuer: ${JWT_ISSUER:pfk-workspace}
      secret: ${JWT_SECRET:dev-only-change-me}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}

  auth:
    cookies:
      access-token-name: ${ACCESS_TOKEN_COOKIE:pfk_access}
      refresh-token-name: ${REFRESH_TOKEN_COOKIE:pfk_refresh}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAMESITE:LAX} # LAX for local; NONE for cross-site HTTPS
      domain: ${COOKIE_DOMAIN:}
      path: /
